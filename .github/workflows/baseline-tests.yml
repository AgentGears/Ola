name: Baseline clean-clone tests

on:
  pull_request:
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'mcp/**'
      - 'eval/**'
      - 'schemas/**'
      - 'tools/**'
      - 'tests/**'
      - 'phase0/**'
      - '.github/workflows/baseline-tests.yml'
      - '.gitignore'
      - '.gitattributes'
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'hooks/**'
      - 'mcp/**'
      - 'eval/**'
      - 'schemas/**'
      - 'tools/**'
      - 'tests/**'
      - 'phase0/**'
      - '.github/workflows/baseline-tests.yml'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  # ── Job 1: Zero-process deterministic gate ─────────────────────────
  # Zero-process tests (no real worker spawns) + 3 independent R2
  # aggregators + ADR package integrity + prohibited-path absence check.
  # This job never spawns real OS worker processes. Suite count is computed
  # in the run step (not hand-maintained).
  zero-process-deterministic:
    name: Zero-process deterministic (computed count + 3 R2 + ADR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prohibited runtime-state path absence check
        run: |
          set -euo pipefail
          # These paths must NEVER be committed. Their presence is a hard fail.
          prohibited=(
            ".ouroboros"
            ".zcode"
            ".zcode-plugin"
            ".playwright-mcp"
            ".chatgpt-collaboration.json"
            ".ola"
            ".moneta"
            "bug-reports"
          )
          found=0
          for p in "${prohibited[@]}"; do
            if [ -e "$p" ]; then
              echo "PROHIBITED PATH PRESENT: $p"
              found=1
            fi
          done
          # Databases and logs must not be tracked
          if find . -path ./.git -prune -o \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) -print | grep -q .; then
            echo "PROHIBITED: database/credential files found in tree"
            find . -path ./.git -prune -o \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.pem' -o -name '*.key' \) -print
            found=1
          fi
          if [ "$found" -ne 0 ]; then
            echo "::error::Prohibited runtime-state or credential paths are present in the repository"
            exit 1
          fi
          echo "PASS: no prohibited runtime-state paths"

      - name: Run zero-process deterministic suites (count computed)
        run: |
          set -euo pipefail
          # Deterministic suites that do NOT spawn real worker processes.
          # offload-hook-structural and offload-spawn-contract use injected fakes
          # (zero real processes) and are safe everywhere.
          # offload-latency spawns real managed workers and runs in the formal-suite job below.
          # The legacy-sentinel-classification suite is registered here for clean-clone
          # evidence and also in offload-stability.yml.
          deterministic_tests=(
            "tests/test-sentinel-survives-canonical-destruction.cjs"
            "tests/test-resolver-ignores-zcode-plugin-data.cjs"
            "tests/test-post-migration-guard-exit.cjs"
            "tests/embed-observability.test.cjs"
            "tests/exact-anchor-override.test.cjs"
            "tests/negative-leakage.test.cjs"
            "tests/fusion-determinism.test.cjs"
            "tests/offload-core.test.cjs"
            "tests/offload-verify.test.cjs"
            "tests/offload-secrets.test.cjs"
            "tests/offload-spool.test.cjs"
            "tests/offload-integration.test.cjs"
            "tests/offload-session.test.cjs"
            "tests/offload-capability.test.cjs"
            "tests/offload-read.test.cjs"
            "tests/offload-rehydration.test.cjs"
            "tests/offload-ops.test.cjs"
            "tests/schema-alias-completeness.test.cjs"
            "tests/rename-inventory.test.cjs"
            "tests/offload-hook-structural.test.cjs"
            "tests/offload-spawn-contract.test.cjs"
            "tests/r2/step5-legacy-sentinel-classification.test.cjs"
            "tests/r2/step5-owned-removal-strict.test.cjs"
            "tests/r2/rollback-tree-restore-primitive.test.cjs"
            "tests/r2/rollback-target-journal.test.cjs"
            "tests/r2/rollback-source-journal.test.cjs"
            "tests/r2/rollback-transcript-journal.test.cjs"
            "tests/r2/rollback-structural-verify.test.cjs"
            "tests/r2/rollback-release-readiness.test.cjs"
          )
          failed=0
          for t in "${deterministic_tests[@]}"; do
            echo "::group::$(basename "$t")"
            if node "$t"; then
              echo "PASS: $t"
            else
              echo "::error::FAIL: $t"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one deterministic suite failed"
            exit 1
          fi
          echo "PASS: ${#deterministic_tests[@]}/${#deterministic_tests[@]} zero-process deterministic suites"

      - name: Run 3 R2 aggregators independently
        run: |
          set -euo pipefail
          for agg in r2-migration-forward r2-migration-refusal r2-migration-closeout; do
            echo "::group::$agg"
            node "tests/${agg}.test.cjs"
            echo "::endgroup::"
          done
          echo "PASS: 3/3 R2 aggregators"

      - name: ADR package integrity verification
        working-directory: docs/architecture/adr-0001
        run: |
          python verify_adr_package.py

      - name: Frozen package-root check
        working-directory: docs/architecture/adr-0001
        run: |
          set -euo pipefail
          expected="94c68edcceec5b8cd6b6b8a188e0f067a242b221dbcc423d70ebabb4e8090bf9"
          actual="$(awk '{print $1}' PACKAGE-ROOT.sha256)"
          echo "expected=$expected"
          echo "actual  =$actual"
          [ "$actual" = "$expected" ]
          echo "PASS: package root matches frozen candidate"

  # ── Job 2: Formal registered suite ─────────────────────────────────
  # Executes tests/run-all.cjs, which contains all 23 registered gates.
  # This INCLUDES offload-latency, which spawns real managed worker processes
  # (bounded, leak-guarded — see offload-stability workflow). The worker
  # lifecycle safety is independently proven by the offload-stability workflow.
  formal-suite:
    name: Formal registered suite (23/23, includes managed real-worker test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Run formal registered suite (tests/run-all.cjs)
        run: |
          set -euo pipefail
          echo "=== Formal registered suite via run-all.cjs ==="
          echo "Proves the runner contains and executes all 23 registered gates."
          echo "NOTE: includes offload-latency, which spawns real managed workers."
          echo "Worker lifecycle safety is independently proven by offload-stability workflow."
          echo "================================================================"
          node tests/run-all.cjs
